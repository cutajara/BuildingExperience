name: Deploy site to S3

on:
  push:
    branches:
      - dev
    paths:
      - index.html
      - '*.png'
      - .github/workflows/deploy-to-s3.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # Preview site only: keep search engines from indexing it (prod is on Netlify)
      - name: Add noindex to preview
        run: |
          sed -i 's|<meta name="viewport"|<meta name="robots" content="noindex, nofollow">\n    &|' index.html
          grep -q 'name="robots" content="noindex' index.html

      - name: Upload site files
        env:
          S3_BUCKET: ${{ vars.AWS_S3_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          aws s3 sync . "s3://${S3_BUCKET}/" --region "${AWS_REGION}" \
            --exclude "*" \
            --include "index.html" \
            --include "*.png"
